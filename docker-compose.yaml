services:
  mcp-weather:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-weather
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    environment:
      - PRIVATE_KEY_PATH=/run/secrets/private_key.pem
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./keys/ed25519-private.pem:/run/secrets/private_key.pem:ro
    restart: unless-stopped
